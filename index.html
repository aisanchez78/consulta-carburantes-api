<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFuel Spain | Observatorio de Carburantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Barra Lateral de Navegación -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-badge">⛽</div>
                <div>
                    <h1>EcoFuel</h1>
                    <span>Observatorio MITECO</span>
                </div>
            </div>

            <nav class="side-nav">
                <p class="nav-label">CONSULTAS API REST</p>
                <button class="nav-item active" data-view="view-ccaa">
                    <span class="icon">🗺️</span> Estaciones por CC.AA.
                </button>
                <button class="nav-item" data-view="view-maritimos">
                    <span class="icon">⚓</span> Postes Marítimos
                </button>
                <button class="nav-item" data-view="view-historico">
                    <span class="icon">📅</span> Histórico por Fecha
                </button>
            </nav>

            <div class="sidebar-footer">
                <p>Fuente oficial:</p>
                <a href="https://geoportalgasolineras.es/" target="_blank">Geoportal Hidrocarburos</a>
            </div>
        </aside>

        <!-- Área Principal -->
        <main class="main-panel">
            <!-- Cabecera Superior -->
            <header class="topbar">
                <div>
                    <h2 id="view-title">Estaciones de Servicio por Comunidad Autónoma</h2>
                    <p id="view-subtitle">Consulta en tiempo real de precios terrestres en territorio nacional</p>
                </div>
                <button id="btn-export-csv" class="btn-outline hidden">⬇ Exportar CSV</button>
            </header>

            <!-- PANEL DE FILTROS -->
            <section class="filter-card">
                <!-- Vista 1: CCAA -->
                <div id="view-ccaa" class="filter-group active">
                    <div class="input-block">
                        <label for="select-ccaa">Seleccione Comunidad Autónoma</label>
                        <select id="select-ccaa">
                            <option value="">Cargando catálogo...</option>
                        </select>
                    </div>
                    <button id="btn-buscar-ccaa" class="btn-accent">Buscar Estaciones</button>
                </div>

                <!-- Vista 2: Postes Marítimos -->
                <div id="view-maritimos" class="filter-group">
                    <div class="input-block">
                        <label for="select-prov-mar">Seleccione Provincia Costera / Insular</label>
                        <select id="select-prov-mar">
                            <option value="">Cargando provincias...</option>
                        </select>
                    </div>
                    <button id="btn-buscar-mar" class="btn-accent">Buscar Postes Marítimos</button>
                </div>

                <!-- Vista 3: Histórico -->
                <div id="view-historico" class="filter-group grid-3">
                    <div class="input-block">
                        <label for="select-prov-hist">Provincia</label>
                        <select id="select-prov-hist">
                            <option value="">Cargando provincias...</option>
                        </select>
                    </div>
                    <div class="input-block">
                        <label for="input-fecha">Fecha de Consulta</label>
                        <input type="date" id="input-fecha" value="2026-05-23">
                    </div>
                    <div class="input-block">
                        <label for="select-producto">Carburante</label>
                        <select id="select-producto">
                            <option value="">Cargando carburantes...</option>
                        </select>
                    </div>
                    <button id="btn-buscar-hist" class="btn-accent">Consultar Histórico</button>
                </div>
            </section>

            <!-- Mensaje de Estado -->
            <div id="alert-box" class="alert-box hidden"></div>

            <!-- Tarjetas Resumen (KPIs) -->
            <section id="kpi-section" class="kpi-grid hidden">
                <div class="kpi-card">
                    <span class="kpi-title">Total Localizadas</span>
                    <strong id="kpi-total" class="kpi-value">0</strong>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Precio Mínimo Detectado</span>
                    <strong id="kpi-min" class="kpi-value highlight-green">-</strong>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Precio Medio</span>
                    <strong id="kpi-avg" class="kpi-value">-</strong>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Actualización API</span>
                    <strong id="kpi-date" class="kpi-value small-text">-</strong>
                </div>
            </section>

            <!-- Buscador Rápido y Selector de Vista -->
            <div id="toolbar" class="toolbar hidden">
                <input type="text" id="quick-filter" placeholder="🔍 Filtrar por municipio, rótulo (Repsol, Cepsa...) o calle...">
                <div class="view-switch">
                    <button id="mode-cards" class="switch-btn active">Tarjetas</button>
                    <button id="mode-table" class="switch-btn">Tabla</button>
                </div>
            </div>

            <!-- Contenedor de Resultados en Tarjetas -->
            <div id="cards-container" class="cards-grid hidden"></div>

            <!-- Contenedor de Resultados en Tabla -->
            <div id="table-container" class="table-card hidden">
                <table>
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
